# ReceiptFlow 設定ファイル
# この値を変更することで動作をカスタマイズできます

# -------------------------------------------------------
# 勘定科目
# -------------------------------------------------------

# 借方勘定科目（消耗品費、会議費、交際費 など）
debit_account = "消耗品費"

# 貸方勘定科目（事業主借、普通預金 など）
credit_account = "事業主借"

# -------------------------------------------------------
# 要チェックフラグ
# -------------------------------------------------------

# この店舗名を含む領収証に要チェックフラグを立てる（部分一致）
# 例：check_stores = ["コンビニ名", "〇〇スーパー"]
check_stores = ["ダイエー", "ダイソー", "EON", "/EON", "DAISO"]

# -------------------------------------------------------
# 品目抽出
# -------------------------------------------------------

# 摘要欄に優先的に採用する品目名キーワード（部分一致）
# ここに含まれる品目が上限 item_max 件まで優先して選ばれる
# 例：自分がよく買う品目名の一部を入れておく
item_keywords = [
    "生活白玉", "はちみつ", "生クリーム", "クーベル",
    "ココア", "三温糖", "うき粉", "バター", "アルミ", "レーヌ",
    "両面テープ", "ラッピング", "包装紙"
]

# 1枚のレシートから摘要に採用する品目の最大件数
item_max = 2

# 品目として採用しないワード（割引・袋代など経費計上不要なもの）
# "有料レ" は "有料レジ袋" の OCR 誤読バリアント
item_exclude_words = ["割引", "%", "％", "レジ袋", "買物袋", "買い物袋", "有料レ"]
