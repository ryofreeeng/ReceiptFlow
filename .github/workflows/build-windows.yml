name: Windows .exe ビルド   # Actions タブに表示される名前（自由につけてよい）

# ─── トリガー ───────────────────────────────────────────
on:
  push:
    tags:
      - "v*"    # "v" で始まるタグ（例: v1.0.0）を push したとき
    branches:
      - main    # main への push（PR マージ含む）でも実行してキャッシュを main に保存する

# ─── 権限 ──────────────────────────────────────────────
# Release の作成・ファイル添付には contents の書き込み権限が必要
permissions:
  contents: write

# ─── ジョブ ─────────────────────────────────────────────
jobs:
  build:                       # ジョブ名（自由につけてよい）
    runs-on: windows-latest    # Windows サーバーで実行（.exe を作るために必須）

    steps:
      # ① ソースコードを Runner（GitHub のサーバー）にダウンロードする
      #    これをしないと Runner 上にコードがない状態になる
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ② Python をインストールする
      #    Runner には Python が入っていることもあるが、バージョンを固定するために必ず書く
      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ローカル環境と合わせる

      # ③ pip キャッシュを設定する
      #    requirements.txt が変わったときだけキャッシュを再作成する（hashFiles で検知）
      #    2回目以降のビルドでは pip のダウンロードをスキップして高速化できる
      - name: pip キャッシュを設定
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache   # Windows の pip キャッシュフォルダ
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # ④ アプリの依存ライブラリをインストールする（requirements.txt に書いてあるもの全部）
      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      # ⑤ PyInstaller をインストールする
      #    requirements.txt には入れず、ビルド用途としてここで追加する
      - name: PyInstaller をインストール
        run: pip install pyinstaller

      # ⑥ .exe を生成する（タグ push のときだけ実行）
      #    main push 時はキャッシュ作成のみが目的のためスキップする
      #    実行後に dist\ReceiptFlow.exe が作られる
      #    --onefile        : 依存ファイルを全部1つの .exe に梱包する
      #    --name           : 出力ファイル名（ReceiptFlow.exe になる）
      #    --collect-all    : 指定パッケージの Python ファイル・バイナリ・データファイルをすべて梱包する
      #                       paddleocr・paddlex は OCR モジュールを動的に読み込むため静的解析で検出できない
      #                       --collect-data（データのみ）では不足するため --collect-all が必要
      #    pipeline.py      : エントリーポイント（最初に実行されるファイル）
      - name: .exe をビルド
        if: startsWith(github.ref, 'refs/tags/')
        run: pyinstaller --onefile --name ReceiptFlow --collect-all paddleocr --collect-all paddlex pipeline.py

      # ⑦ GitHub Release を作成して .exe と使い方ガイドを添付する
      #    タグ push のときだけ実行（main push はキャッシュ作成目的のため Release は不要）
      #    github.token   : GitHub が自動で発行するトークン。シークレット設定は不要
      #    github.ref_name: push したタグ名（例: v1.0.0）が自動で入る
      #    --generate-notes: PRの一覧からリリースノートを自動生成（直接 push 運用では比較リンクのみ）
      #    shell: bash を指定することで Windows Runner でも bash コマンドが使える
      - name: GitHub Release を作成して .exe と使い方ガイドを添付
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes "dist/ReceiptFlow.exe" "docs/ReceiptFlow_exe_使い方.md"
